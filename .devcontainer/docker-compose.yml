version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Update 'VARIANT' to pick a version of PHP version: 8, 8.1, 8.0, 7, 7.4
        # Append -bullseye or -buster to pin to an OS version.
        # Use -bullseye variants on local arm64/Apple Silicon.
        VARIANT: "8-bullseye"
        # Optional Node.js version
        NODE_VERSION: "lts/*"


    volumes:
      - ..:/workspace:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    # network_mode: service:db
    ports:
      - "0.0.0.0:8080:8080"

    networks:
      - app-network

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: mariadb:10.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: blessingskin
      MYSQL_USER: username
      MYSQL_PASSWORD: secret

    # Add "forwardPorts": ["3306"] to **devcontainer.json** to forward MariaDB locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    networks:
      - app-network

    ports:
      - "0.0.0.0:3306:3306"

  # 新增 phpMyAdmin 服务
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db  # 连接到 MariaDB 服务
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 1024M  # 可选：增加上传限制
    ports:
      - "0.0.0.0:3399:80"  # 映射到宿主机端口 3399
    depends_on:
      - db
    networks:
      - app-network
    # 可选：如果需要持久化配置，可以添加卷
    volumes:
      - phpmyadmin-config:/etc/phpmyadmin
      - phpmyadmin-sessions:/sessions

volumes:
  mariadb-data:
  #  可选：如果需要持久化 phpMyAdmin 配置
  phpmyadmin-config:
  phpmyadmin-sessions:

networks:
  app-network:
    driver: bridge
